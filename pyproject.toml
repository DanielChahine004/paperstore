[project]
name = "paperstore"
version = "0.1.0"
description = "A git folder of papers checked against their DOIs, with quote-anchored annotations and a web viewer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Chahine" }]
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24"]

[project.scripts]
paperstore = "paperstore.cli:main"

[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 license-files (a list) needs 1.27
build-backend = "hatchling.build"
