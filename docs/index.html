<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<title>Paper Store</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css">
<link rel="stylesheet" href="style.css?v=14">
<script>   /* the saved theme, before anything draws (app.js keeps it up to date) */
try { const m = localStorage.getItem("ps.theme"), r = document.documentElement; if (m === "light" || m === "dark" || m === "dark-pages") r.dataset.theme = m === "light" ? "light" : "dark"; if (m === "dark-pages") r.dataset.pages = "original"; } catch {}
</script>
<script src="config.js?v=14"></script>
<script type="module" src="app.js?v=14"></script>
</head>
<body>
<header id="bar"></header>
<main id="main"></main>
<aside id="panel" hidden></aside>
<div id="pop" hidden></div>
<dialog id="composer"></dialog>
<div id="toast" role="status" hidden></div>
</body>
</html>
